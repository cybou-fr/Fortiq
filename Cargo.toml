[workspace]
resolver = "2"
members = [
    "apps/fortiq-service",
    "crates/fortiq-core",
    "crates/fortiq-p2p",
    "crates/fortiq-shell",
]
exclude = [
    "apps/fortiq-desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.81"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
libp2p = { version = "0.56", features = ["dcutr", "identify", "json", "macros", "noise", "ping", "quic", "relay", "rendezvous", "request-response", "tokio", "yamux"] }
libp2p-stream = "0.4.0-alpha"
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.41", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4"] }
