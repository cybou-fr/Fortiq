[node]
name = "fortiq-relay"

[identity]
path = "/var/lib/fortiq/relay.identity"

[network]
listen_quic = "0.0.0.0:4001"
# Public multiaddr advertised to peers for direct UDP QUIC connections
public_addr = "/ip4/51.255.46.58/udp/4001/quic-v1"

[capabilities]
rendezvous = true
relay = true
relay_rate_limit = true
