name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The default token is read-only, and no job here needs more.
permissions:
  contents: read

jobs:
  build-and-test:
    # Windows x64 is the first supported platform, and the pinned engine is a win-x64 build.
    runs-on: windows-latest

    steps:
      # Actions are pinned to commit SHAs: a tag can be moved to different code at any time, and a
      # workflow that trusts a tag re-runs whatever that tag points at today.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Acquire pinned repository engine
        shell: pwsh
        # The binary is not committed. The script verifies the archive SHA-256 before extracting and
        # the binary length and SHA-256 afterwards; a mismatch fails the job instead of downgrading
        # the run to a skipped recovery suite.
        run: ./scripts/Get-Engine.ps1

      - name: Check documentation claims
        shell: pwsh
        # Runs before the build, because it needs no build and its failures are the cheapest to fix.
        # Only the published documents are checked here: docs/ is excluded from version control, so
        # a clone has nothing else to look at. Run the script locally to cover the specifications.
        run: ./scripts/Test-DocumentationClaims.ps1

      - name: Build
        shell: pwsh
        run: dotnet build Fortiq.sln --configuration Release

      - name: Test
        shell: pwsh
        env:
          FORTIQ_TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/receipts
        # One TRX per test assembly, named after it. A single shared file name makes the assemblies
        # overwrite each other, and the run whose evidence is lost is usually the one that failed.
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $isElevated = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $privilegeFilter = if ($isElevated) {
            'PrivilegeMode!=StandardUser'
          } else {
            'PrivilegeMode!=ElevatedVss'
          }
          "VSS privilege lane: $(if ($isElevated) { 'elevated' } else { 'standard-user' })"

          $failed = $false
          foreach ($project in Get-ChildItem tests -Filter *.csproj -Recurse) {
            $testArguments = @(
              'test', $project.FullName,
              '--configuration', 'Release',
              '--no-build',
              '--logger', "trx;LogFileName=$($project.BaseName).trx",
              '--results-directory', 'artifacts/test-results'
            )
            if ($project.BaseName -eq 'Fortiq.Recovery.IntegrationTests') {
              $testArguments += @('--filter', $privilegeFilter)
            }
            & dotnet @testArguments
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw "One or more test assemblies failed." }

      - name: Installed-Windows pilot lane
        shell: pwsh
        # The boundaries a pilot machine actually has: an elevated install with real ACLs, and
        # service registration through the SCM. It is a separate step, not part of the loop above,
        # because it is the only one that must fail when its tests skip - a lane that quietly does
        # nothing reports the same green as one that passed, and these are the boundaries where that
        # matters most. The runner is elevated, so the lane runs.
        run: ./scripts/Test-InstalledPilot.ps1 -ResultsDirectory artifacts/test-results

      - name: Report failed tests as annotations
        if: always()
        shell: pwsh
        # A failing job whose only annotation is "exit code 1" cannot be diagnosed without its log,
        # and a log is not always reachable. The names and messages of failed tests belong here.
        run: ./scripts/Write-TestFailures.ps1

      - name: Upload receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fortiq-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
