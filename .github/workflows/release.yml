name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Only what attestation needs: read the repository, write an attestation, and mint the token that
# signs it. Nothing here writes to the repository itself.
permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Acquire pinned repository engine
        shell: pwsh
        run: ./scripts/Get-Engine.ps1

      - name: Test before publishing anything
        shell: pwsh
        # A release is only worth building from a tree whose tests pass; the same run also produces
        # the evidence CI keeps.
        env:
          FORTIQ_TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/receipts
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $isElevated = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $privilegeFilter = if ($isElevated) {
            'PrivilegeMode!=StandardUser'
          } else {
            'PrivilegeMode!=ElevatedVss'
          }
          "VSS privilege lane: $(if ($isElevated) { 'elevated' } else { 'standard-user' })"

          $failed = $false
          foreach ($project in Get-ChildItem tests -Filter *.csproj -Recurse) {
            $testArguments = @(
              'test', $project.FullName,
              '--configuration', 'Release',
              '--logger', "trx;LogFileName=$($project.BaseName).trx",
              '--results-directory', 'artifacts/test-results'
            )
            if ($project.BaseName -eq 'Fortiq.Recovery.IntegrationTests') {
              $testArguments += @('--filter', $privilegeFilter)
            }
            & dotnet @testArguments
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw "One or more test assemblies failed." }

      - name: Report failed tests as annotations
        if: always()
        shell: pwsh
        run: ./scripts/Write-TestFailures.ps1

      - name: Publish release artifacts
        shell: pwsh
        run: ./scripts/New-ReleaseArtifacts.ps1

      - name: State the signing status of this build
        shell: pwsh
        # An unsigned build must say so. Signing needs a certificate this repository does not hold,
        # so the release is published unsigned rather than published as if it were signed.
        run: |
          $unsigned = Get-ChildItem artifacts/release/recover -Filter 'Fortiq.*.exe' |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' } |
            ForEach-Object { $_.Name }
          if ($unsigned) {
            "::warning::This release is not Authenticode-signed: $($unsigned -join ', ')"
          }

      - name: Attest what this build produced
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Provenance says which workflow, from which commit, produced these exact files. It is not
          # a substitute for signing them, and it is not claimed to be.
          subject-path: |
            artifacts/release/recover/Fortiq.Recover.exe
            artifacts/release/recover/Fortiq.PasswordHelper.exe
            artifacts/release/Fortiq-Community-*.zip
            artifacts/release/sbom.json
            artifacts/release/SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fortiq-release
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
