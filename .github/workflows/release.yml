name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-service:
    name: Build fortiq-service (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: fortiq-service
            asset_name: fortiq-service-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: fortiq-service.exe
            asset_name: fortiq-service-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} -p fortiq-service -p fortiq-cli

      - name: Package Binary (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf ${{ matrix.asset_name }} -C target/${{ matrix.target }}/release fortiq-service fortiq
          chmod +x packaging/linux/build_deb.sh
          VERSION="${GITHUB_REF_NAME#v}"
          ./packaging/linux/build_deb.sh "${VERSION}" "${{ matrix.target }}"

      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path target\${{ matrix.target }}\release\fortiq-service.exe, target\${{ matrix.target }}\release\fortiq.exe, packaging\windows\install.ps1, packaging\windows\uninstall.ps1, packaging\windows\fortiq.toml.example -DestinationPath ${{ matrix.asset_name }}

      - name: Upload Service Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
            target/debian/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop:
    name: Build fortiq-desktop (${{ matrix.platform }})
    needs: build-service
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            os: macos-latest
          - platform: "ubuntu-22.04"
            os: ubuntu-22.04
          - platform: "windows-latest"
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Frontend Dependencies
        working-directory: apps/fortiq-desktop
        run: npm ci

      - name: Build Desktop Application Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "apps/fortiq-desktop"
          tagName: ${{ github.ref_name }}
          releaseName: "FORTIQ v__VERSION__"
          releaseBody: "See release notes and commit history for details."
          releaseDraft: false
          prerelease: false

